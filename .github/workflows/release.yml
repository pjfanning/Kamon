name: Release

# sbt-ci-release: merges to main publish a signed -SNAPSHOT to the Sonatype Central snapshots repository,
# and pushing a tag starting with "v" (e.g. v2.8.1-1) publishes a release to Maven Central.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'pjfanning/Kamon'
    env:
      JAVA_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags, so sbt-dynver can compute the version
          fetch-depth: 0
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt
      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          # sign the snapshot jars too (sbt-ci-release publishes snapshots unsigned by default)
          CI_SNAPSHOT_RELEASE: +publishSigned
