name: Test all the things

on:
  pull_request:
  push:
    branches:
      - main

env:
  JAVA_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
  JVM_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17 ]
        include:
          # Play 3 requires Java 11+, so kamon-play is excluded on Java 8
          - java: 8
            test-command: '"+kamon-pekko/test" "+kamon-pekko-http/test" "+kamon-pekko-grpc/test" "+kamon-pekko-connectors-kafka/test"'
    name: ci (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags, so sbt-dynver can compute the version (works even if there are no tags yet)
          fetch-depth: 0
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:${{ matrix.java }}
          apps: sbt
      - name: Test
        run: sbt -v ${{ matrix.test-command || '"+instrumentation/test"' }}
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt
      - name: Test
        run: sbt -v "+scalafmtCheckAll;scalafmtSbtCheck"
